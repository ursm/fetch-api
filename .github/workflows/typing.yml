name: Typing

on:
  push:

permissions:
  contents: read

jobs:
  typing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - run: bundle exec rbs collection install
      - run: bundle exec rake rbs
      - run: bundle exec rake steep
